apiVersion: batch/v1
kind: CronJob
metadata:
  name: store-report
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: store-report }
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: store-report
              image: 345843269906.dkr.ecr.us-east-1.amazonaws.com/store-worker:1.0
              command: [python, -m, worker.relatorio]
              envFrom:
                - configMapRef: { name: store-api-config }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: db-credentials, mountPath: /var/run/secrets/db, readOnly: true }
          volumes:
            - name: db-credentials
              secret: { secretName: store-db-credentials }
