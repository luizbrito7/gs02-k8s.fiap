# Constrói, escaneia (trivy) e publica as 3 imagens no ECR a cada mudança em app/
name: images

on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  id-token: write # token OIDC para assumir a role na AWS
  contents: read

env:
  REGISTRY: 345843269906.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [store-api, store-worker, store-front]
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::345843269906:role/github-ecr-gs-lab
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: build
        run: |
          echo "IMAGE=$REGISTRY/${{ matrix.image }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker build --build-arg APP_VERSION=sha-${GITHUB_SHA::7} -t "$REGISTRY/${{ matrix.image }}:sha-${GITHUB_SHA::7}" app/${{ matrix.image }}

      - name: trivy (falha com CRITICAL ou HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: push
        run: docker push "$IMAGE"

  # Grava as tags novas no Git: o Argo CD vê o commit e faz o rollout
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: deploy # um commit de deploy por vez
    steps:
      - uses: actions/checkout@v7

      - name: atualiza as tags no kustomization
        working-directory: k8s/fiap-store
        run: |
          TAG=sha-${GITHUB_SHA::7}
          for img in store-api store-worker store-front; do
            kustomize edit set image $REGISTRY/$img:$TAG
          done

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: imagens sha-${GITHUB_SHA::7}"
          git pull --rebase && git push
